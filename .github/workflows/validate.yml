name: Validate prompt library

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate prompts
        run: npm run validate
      - name: Build README index and catalog
        run: npm run build:readme && npm run build:catalog
      - name: Check generated files
        run: git diff --exit-code -- docs/prompt-index.md catalog/prompts.json
