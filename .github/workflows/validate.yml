name: Validate prompts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate prompt entries
        run: npm run validate

      - name: Build prompt index
        run: npm run build:readme

      - name: Ensure generated index is committed
        run: git diff --exit-code -- docs/prompt-index.md
